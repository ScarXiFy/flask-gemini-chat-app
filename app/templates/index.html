{% extends "base.html" %}

{% block title %}Home | Flask Gemini Chat{% endblock %}

{% block content %}
<section class="chat-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <div class="chat-card shadow-sm">
          <div class="chat-layout">
            <aside class="conversation-sidebar">
              <div class="sidebar-header">
                <h2 class="h6 mb-0">Chats</h2>
                <button class="btn btn-sm btn-primary" id="new-chat-button" type="button">
                  New Chat
                </button>
              </div>
              <div class="conversation-list" id="conversation-list" aria-label="Conversations"></div>
            </aside>

            <div class="chat-main">
              <div class="chat-header">
                <div>
                  <h1 class="h4 mb-1">Flask Gemini Chat</h1>
                  <p class="mb-0 text-secondary">Chat with Gemini</p>
                </div>
              </div>

              <div class="chat-window" id="chat-window" aria-label="Chat messages">
                <div class="empty-state">Start a conversation with Gemini.</div>
              </div>

              <form class="chat-form" id="chat-form" aria-label="Chat form">
                <label class="visually-hidden" for="message">Message</label>
                <input
                  class="form-control"
                  id="message"
                  name="message"
                  type="text"
                  placeholder="Type a message..."
                  autocomplete="off"
                >
                <button class="btn btn-primary" id="send-button" type="submit">Send</button>
              </form>
              <p class="chat-note mb-0">
                Messages are sent to the Flask backend, then answered by Gemini.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
